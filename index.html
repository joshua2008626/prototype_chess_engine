<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pulse Chess Engine - Minimax Visualizer</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        h1 { color: #4CAF50; text-align: center; }
        .main-container { display: flex; justify-content: center; gap: 30px; align-items: flex-start; flex-wrap: wrap; margin-top: 20px; }
        #board { width: 400px; }
        .panel { background: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 8px; width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h3 { margin-top: 0; color: #ffeb3b; border-bottom: 1px solid #333; padding-bottom: 8px; }
        #status { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #ffeb3b; text-align: center; }
        .log-line { font-family: monospace; font-size: 13px; color: #b0bec5; margin: 6px 0; background: #262626; padding: 6px; border-radius: 4px; }
        .highlight { color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>

    <h1>⚡ Pulse Chess Engine (4-Ply Minimax) ⚡</h1>
    
    <div class="main-container">
        <!-- Left: Chessboard -->
        <div>
            <div id="board"></div>
            <div id="status">Your turn (White)</div>
        </div>

        <!-- Right: Minimax Live Analytics Panel -->
        <div class="panel">
            <h3>🧠 Minimax / Alpha-Beta Log</h3>
            <div id="minimax-logs">
                <div class="log-line">Waiting for first move...</div>
            </div>
        </div>
    </div>

    <script>
        var board = null;
        var game = new Chess();

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over() || game.turn() !== 'w') return false;
        }

        function makeEngineMove() {
            if (game.game_over()) return;

            $('#status').text("Pulse is thinking (Depth 4)...");
            $('#minimax-logs').prepend(`<div class="log-line">🔍 Searching depth 4 tree with Alpha-Beta...</div>`);

            $.ajax({
                url: 'http://127.0.0.1:5000/move',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ fen: game.fen() }),
                success: function(response) {
                    if (response.best_move) {
                        var f = response.best_move.substring(0, 2);
                        var t = response.best_move.substring(2, 4);
                        var promo = response.best_move.length > 4 ? response.best_move[4] : 'q';
                        
                        game.move({ from: f, to: t, promotion: promo });
                        board.position(game.fen());
                        updateStatus();

                        // Log the Minimax stats on the right panel
                        let logHtml = `
                            <div class="log-line">🤖 <b>Engine Played:</b> <span class="highlight">${response.best_move}</span></div>
                            <div class="log-line">📊 <b>Board Score:</b> ${response.eval} cp</div>
                            <div class="log-line">⚡ <b>Nodes Searched:</b> ${response.nodes}</div>
                            <div class="log-line">⏱️ <b>Calculation Time:</b> ${response.time}s</div>
                            <hr style="border-color: #333;">
                        `;
                        $('#minimax-logs').prepend(logHtml);
                    }
                },
                error: function() {
                    $('#status').text("Error connecting to Python backend!");
                }
            });
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' 
            });

            if (move === null) {
                $('#status').text("❌ Illegal move! Try again.");
                return 'snap';
            }

            updateStatus();

            if (!game.game_over()) {
                window.setTimeout(makeEngineMove, 250);
            }
        }

        function updateStatus() {
            var status = '';
            var moveColor = (game.turn() === 'w') ? 'White' : 'Black';

            if (game.in_checkmate()) {
                if (game.turn() === 'w') {
                    status = '🏆 Checkmate! Congratulations, Black (Engine) won!';
                } else {
                    status = '🎉 Checkmate! Congratulations, YOU WON!';
                }
            } else if (game.in_draw()) {
                status = 'Game over, drawn position.';
            } else {
                status = moveColor + "'s turn";
                if (game.in_check()) {
                    status += ' (Check!)';
                }
            }
            $('#status').text(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        board = Chessboard('board', config);
        updateStatus();
    </script>
</body>
</html>

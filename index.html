<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pulse Chess Engine</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin-top: 30px; }
        #board { width: 400px; margin: 20px auto; }
        h1 { color: #4CAF50; }
        #status { font-size: 20px; font-weight: bold; margin-top: 15px; color: #ffeb3b; }
    </style>
</head>
<body>

    <h1>⚡ Pulse Chess Engine ⚡</h1>
    <p>Play against your custom Python AI!</p>
    
    <div id="board"></div>
    <div id="status">Your turn (White)</div>

    <script>
        var board = null;
        var game = new Chess();

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over() || game.turn() !== 'w') return false;
        }

        function makeEngineMove() {
            if (game.game_over()) return;

            $('#status').text("Pulse is thinking...");

            $.ajax({
                url: 'http://127.0.0.1:5000/move',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ fen: game.fen() }),
                success: function(response) {
                    if (response.best_move) {
                        var f = response.best_move.substring(0, 2);
                        var t = response.best_move.substring(2, 4);
                        var promo = response.best_move.length > 4 ? response.best_move[4] : 'q';
                        
                        game.move({ from: f, to: t, promotion: promo });
                        board.position(game.fen());
                        updateStatus();
                    }
                },
                error: function() {
                    $('#status').text("Error connecting to Python backend!");
                }
            });
        }

        function onDrop (source, target) {
            // Attempt the move in chess.js
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' 
            });

            // If the move is illegal, reject it, display text, and snap back
            if (move === null) {
                $('#status').text("❌ Illegal move! Try again.");
                return 'snap';
            }

            updateStatus();

            if (!game.game_over()) {
                window.setTimeout(makeEngineMove, 250);
            }
        }

        function updateStatus() {
            var status = '';
            var moveColor = (game.turn() === 'w') ? 'White' : 'Black';

            if (game.in_checkmate()) {
                if (game.turn() === 'w') {
                    status = '🏆 Checkmate! Congratulations, Black (Engine) won!';
                } else {
                    status = '🎉 Checkmate! Congratulations, YOU WON!';
                }
            } else if (game.in_draw()) {
                status = 'Game over, drawn position.';
            } else {
                status = moveColor + "'s turn";
                if (game.in_check()) {
                    status += ' (Check!)';
                }
            }
            $('#status').text(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        board = Chessboard('board', config);
        updateStatus();
    </script>
</body>
</html>
